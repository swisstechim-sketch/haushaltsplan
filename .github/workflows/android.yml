name: Android APK
on:
  workflow_dispatch:
    inputs:
      prepare_release:
        description: 'Create a draft GitHub Release after successful tests'
        type: boolean
        default: false
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          set -e
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
            if [ -z "$SDKMANAGER" ]; then
              echo "::error::Android command-line tools missing and required SDK components unavailable"
              exit 1
            fi
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: JavaScript syntax
        run: node --check app/src/main/assets/app.js
      - name: Reminder eligibility regression tests
        run: node tests/reminders.test.cjs
      - name: Housekeeping regression tests
        run: node tests/housekeeping.test.cjs
      - name: Finance regression tests
        run: node tests/finance.test.cjs
      - name: Tablet and UI regression tests
        run: node tests/ui-regression.test.cjs
      - name: PDF report regression tests
        run: node tests/reports.test.cjs
      - name: Reservation pricing regression tests
        run: node tests/pricing.test.cjs
      - name: Backup regression tests
        run: node tests/backup.test.cjs
      - name: Storage regression tests
        run: node tests/storage.test.cjs
      - name: Build and unit tests
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ] || ! grep -Eq '429|Too Many Requests' "$RUNNER_TEMP/gradle-build.log"; then
              exit 1
            fi
            sleep "$((attempt * 60))"
          done
      - name: Compile native Android tests
        run: gradle --no-daemon --stacktrace :app:assembleDebugAndroidTest
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: STAY-Swiss-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android database tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest || { adb logcat -d -s StayDatabase AndroidRuntime TestRunner; find app/build/outputs/androidTest-results -name '*.xml' -exec cat {} +; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-reports
          path: app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  release:
    permissions:
      contents: write
    needs: [build, emulator-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed release APK
        shell: bash
        env:
          STAY_KEYSTORE_BASE64: ${{ secrets.STAY_KEYSTORE_BASE64 }}
          STAY_STORE_PASSWORD: ${{ secrets.STAY_STORE_PASSWORD }}
          STAY_KEY_ALIAS: ${{ secrets.STAY_KEY_ALIAS }}
          STAY_KEY_PASSWORD: ${{ secrets.STAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in STAY_KEYSTORE_BASE64 STAY_STORE_PASSWORD STAY_KEY_ALIAS STAY_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; exit 1; fi
          done
          umask 077
          export STAY_KEYSTORE_PATH="$RUNNER_TEMP/stay-release.p12"
          trap 'rm -f "$STAY_KEYSTORE_PATH"' EXIT
          printf '%s' "$STAY_KEYSTORE_BASE64" | base64 --decode > "$STAY_KEYSTORE_PATH"
          unset STAY_KEYSTORE_BASE64
          gradle --no-daemon :app:assembleRelease
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/STAY-Swiss-1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release/STAY-Swiss-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: STAY-Swiss-1.0.0-release
          path: release/STAY-Swiss-1.0.0.apk
          if-no-files-found: error
      - name: Prepare draft GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 release/STAY-Swiss-1.0.0.apk --draft --target "$GITHUB_SHA" --title "STAY Swiss 1.0.0" --notes "Signed Android release. Automated tests passed. Review device testing before publication."
