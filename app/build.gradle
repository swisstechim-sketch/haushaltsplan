plugins { id 'com.android.application' }
android { namespace 'ch.swisstech.stay'; compileSdk 35
 defaultConfig { applicationId 'ch.swisstech.stay'; minSdk 23; targetSdk 35; versionCode 2; versionName '1.0.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 signingConfigs {
  release {
   if (System.getenv('STAY_KEYSTORE_PATH')) {
    storeFile file(System.getenv('STAY_KEYSTORE_PATH'))
    storeType 'PKCS12'
    storePassword System.getenv('STAY_STORE_PASSWORD')
    keyAlias System.getenv('STAY_KEY_ALIAS')
    keyPassword System.getenv('STAY_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  release {
   debuggable false
   minifyEnabled false
   signingConfig signingConfigs.release
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'androidx.core:core:1.15.0'; implementation 'com.google.zxing:core:3.5.3'; androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1' }
